name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          unzip -q dragonbrood-forge-1.20.1-source.zip
          curl -L -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk && unzip -q mdk.zip -d mdk
          rm -rf mdk/src && cp -r dragonbrood/src mdk/src
          cd mdk
          sed -i 's/^mod_id=.*/mod_id=dragonbrood/; s/^mod_name=.*/mod_name=Dragon Brood/; s/^mod_version=.*/mod_version=1.0.0/; s/^mod_group_id=.*/mod_group_id=com.dragonbrood/' gradle.properties
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: dragonbrood-jar
          path: mdk/build/libs/*.jar
